<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friday Night Funkin VS. Sky</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { display: block; width: 100%; height: 100%; border: 0; }
    #loading { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; color: #fff; font: 16px sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading Friday Night Funkin VS. Sky...</div>
  <iframe id="game" title="Friday Night Funkin VS. Sky" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <script>
    const sourceUrl = "https://cdn.jsdelivr.net/gh/freebuisness/html@main/556.html";
    const frame = document.getElementById("game");
    const loading = document.getElementById("loading");

    function addBaseUrl(html) {
      if (/<base\s/i.test(html)) return html;
      const baseTag = '<base href="' + new URL(".", sourceUrl).href + '">';
      return /<head[^>]*>/i.test(html)
        ? html.replace(/<head[^>]*>/i, (head) => head + baseTag)
        : baseTag + html;
    }

    fetch(sourceUrl)
      .then((response) => {
        if (!response.ok) throw new Error("Game source returned " + response.status);
        return response.text();
      })
      .then((html) => {
        const blob = new Blob([addBaseUrl(html)], { type: "text/html;charset=utf-8" });
        frame.src = URL.createObjectURL(blob);
        frame.addEventListener("load", () => loading.remove(), { once: true });
      })
      .catch((error) => {
        console.error("Friday Night Funkin VS. Sky" + " failed to load:", error);
        loading.textContent = "Unable to load " + "Friday Night Funkin VS. Sky" + ". Please try again.";
      });
  </script>
</body>
</html>
