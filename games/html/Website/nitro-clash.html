<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nitro Clash</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { display: block; width: 100%; height: 100%; border: 0; }
    #loading { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; color: #fff; font: 16px sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading Nitro Clash...</div>
  <iframe id="game" title="Nitro Clash" src="https://nitroclash.io/" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <script>
    const frame = document.getElementById("game");
    const loading = document.getElementById("loading");
    frame.addEventListener("load", () => loading.remove(), { once: true });
  </script>
</body>
</html>
